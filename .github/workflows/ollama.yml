# .github/workflows/ollama.yml
name: ollama
on: push
jobs:
  ollama:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Ollama
        uses: ai-action/setup-ollama@v2

      - name: Run model
        run: ollama run beam:cloud 'What model are you?'
        env:
           ollama-api-key: ${{ secrets.OLLAMA_API_KEY }}
